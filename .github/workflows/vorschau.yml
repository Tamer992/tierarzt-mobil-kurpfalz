# Vorschau auf GitHub Pages: veröffentlicht den gebauten Ordner site/ bei jedem Push auf main.
# Vor dem Commit lokal bauen (npm run bauen), der Workflow baut nicht selbst.
name: Vorschau
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/recherche
          cp -r site/. _site/
          cp recherche/index.html _site/recherche/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
